name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build Unsigned iOS .IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Required by Capacitor v8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npx vite build

      - name: Setup Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iOS Project (Disable Code Signing for Sideloading & Add Permissions)
        run: |
          cd ios/App
          # Disable automatic signing requirements for unsigned sideload build
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' App.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj || true

          # Inject iOS Privacy Permission Keys into Info.plist (Prevents instant iOS crash when opening file picker, camera, or mic)
          PLIST="App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Configuring Info.plist permissions..."
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'BT-Dubber requires access to your photo library to import videos and audio.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'BT-Dubber requires access to your photo library to import videos and audio.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'BT-Dubber requires permission to save exported videos to your photo library.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'BT-Dubber requires permission to save exported videos to your photo library.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'BT-Dubber requires camera access to capture video footage.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'BT-Dubber requires camera access to capture video footage.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'BT-Dubber requires microphone access for voice dubbing and recording.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'BT-Dubber requires microphone access for voice dubbing and recording.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
            echo "Info.plist configured successfully!"
          fi
          cd ../..

      - name: Build iOS Archive (xcodebuild)
        run: |
          # Detect whether project uses Swift Package Manager (App.xcodeproj) or CocoaPods (App.xcworkspace)
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi
          echo "Selected target: $TARGET_ARG"

          xcodebuild $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App into .IPA format
        run: |
          mkdir -p Payload
          # Copy the compiled .app bundle from the archive into Payload/
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qr BT-Dubber-Studio-iOS.ipa Payload
          echo "=== IPA Package generated successfully ==="
          ls -lh BT-Dubber-Studio-iOS.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Dubber-Studio-iOS-IPA
          path: BT-Dubber-Studio-iOS.ipa
          retention-days: 14
          if-no-files-found: error
