name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build Unsigned iOS .IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Required by Capacitor v8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npx vite build

      - name: Setup Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iOS Project (Disable Code Signing for Sideloadly/TrollStore)
        run: |
          cd ios/App
          # Turn off automatic code signing in the pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' App.xcodeproj/project.pbxproj || true
          cd ../..

      - name: Build iOS Archive (xcodebuild)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App into .IPA format
        run: |
          mkdir -p Payload
          # Copy whatever .app bundle was created in the archive
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qr BT-Dubber-Studio-iOS.ipa Payload
          echo "=== IPA Package generated successfully ==="
          ls -lh BT-Dubber-Studio-iOS.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Dubber-Studio-iOS-IPA
          path: BT-Dubber-Studio-iOS.ipa
          retention-days: 14
          if-no-files-found: error
